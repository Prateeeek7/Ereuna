<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ereuna — Research, on your radar</title>
  <meta name="description" content="Give Ereuna a research topic or your own PDFs. It maps the papers, findings, author-stated gaps and disagreements, with the source sentence behind every item." />
  <meta name="theme-color" content="#121210" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ereuna — Research, on your radar" />
  <meta property="og:description" content="Maps of the research literature with the source sentence behind every finding." />
  <meta name="twitter:card" content="summary" />

  <script>
    // Apply the theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('ereuna_theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300,0..1,0&display=block" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="max-width:560px;margin:80px auto;padding:0 24px;font-family:Georgia,serif;color:#171614">
      <h1>Ereuna</h1>
      <p>Ereuna needs JavaScript to run. Please enable it and reload the page.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
